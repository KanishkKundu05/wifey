<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#faf8f4" />
    <title>Come to my wedding?</title>
    <style>
      :root {
        font-family: Arial, sans-serif;
        color: #403b37;
        background: #faf8f4;
        font-synthesis: none;
        -webkit-font-smoothing: antialiased;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 32px 24px;
        background: #faf8f4;
        transition: background-color 700ms ease;
      }

      main {
        width: min(100%, 640px);
        text-align: center;
        padding-bottom: 5vh;
      }

      h1 {
        font-family: "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif;
        font-size: clamp(36px, 6vw, 58px);
        font-weight: 400;
        letter-spacing: -0.045em;
        line-height: 1.15;
        margin: 0 0 44px;
      }

      form { width: min(100%, 340px); margin-inline: auto; }

      .field {
        display: flex;
        border-bottom: 1px solid #b9b2a9;
        transition: border-color 150ms;
      }

      .field:focus-within { border-color: #403b37; }

      input {
        width: 100%;
        min-width: 0;
        border: 0;
        border-radius: 0;
        outline: none;
        background: transparent;
        padding: 14px 0;
        color: inherit;
        font: inherit;
        font-size: 16px;
      }

      input::placeholder { color: #918980; }

      button {
        display: grid;
        place-items: center;
        flex: 0 0 44px;
        border: 0;
        background: transparent;
        color: inherit;
        cursor: pointer;
        transition: transform 150ms;
      }

      button:hover { transform: translateX(3px); }
      button:focus-visible { outline: 1px solid currentColor; outline-offset: 3px; }

      .hint {
        margin: 14px 0 0;
        color: #918980;
        font-size: 11px;
        letter-spacing: 0.035em;
      }

      body.accepted { background: #f6dce3; }
      .accepted h1 { margin-bottom: 0; }
      .accepted h1 span { display: block; }
      .accepted h1 span + span {
        margin-top: 18px;
        font-size: clamp(24px, 4.5vw, 38px);
        letter-spacing: -0.035em;
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { transition: none !important; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1 id="message" aria-live="polite">Come to my wedding?</h1>
      <form>
        <div class="field">
          <input
            type="email"
            name="email"
            aria-label="Your email address"
            placeholder="Your email address"
            autocomplete="email"
            autocapitalize="none"
            spellcheck="false"
            required
          />
          <button type="submit" aria-label="Submit email">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M4 12h15m-6-6 6 6-6 6" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </button>
        </div>
        <p class="hint">Press enter to reply</p>
      </form>
    </main>
    <script>
      const form = document.querySelector('form');
      form.addEventListener('submit', (event) => {
        event.preventDefault();
        if (!form.reportValidity()) return;
        document.body.classList.add('accepted');
        document.querySelector('#message').innerHTML =
          '<span>Thank you.</span><span>I hope to see you in India.</span><span>in (hopefully) ~5 years</span>';
        form.hidden = true;
        document.querySelector('meta[name="theme-color"]').content = '#f6dce3';
      });
    </script>
  </body>
</html>
